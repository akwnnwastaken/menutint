name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MenuTint.app
        run: ./scripts/build-app.sh

      - name: Zip
        run: ditto -c -k --keepParent build/MenuTint.app build/MenuTint.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/MenuTint.zip
          generate_release_notes: true
          body: |
            macOS menü çubuğundaki beyaz simgeleri ve yazıları istediğin renge boyar.

            **Kurulum:** `MenuTint.zip` dosyasını indir, açıp `MenuTint.app`'i Uygulamalar klasörüne taşı.
            Uygulama imzasız olduğu için ilk açılışta sağ tıklayıp **Aç**'ı seç
            (veya `xattr -dr com.apple.quarantine /Applications/MenuTint.app`).
            Ardından Ekran Kaydı iznini ver ve uygulamayı yeniden aç.

            Gereksinim: macOS 13 veya üstü (Apple Silicon ve Intel).
