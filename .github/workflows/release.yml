name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MenuTint.app
        run: ./scripts/build-app.sh

      - name: Zip
        run: ditto -c -k --keepParent build/MenuTint.app build/MenuTint.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Manual runs create the tag on the commit being built.
          tag_name: ${{ inputs.version || github.ref_name }}
          name: MenuTint ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: build/MenuTint.zip
          generate_release_notes: true
          body: |
            Recolors the white icons and text in the macOS menu bar.

            **Install:** download `MenuTint.zip`, unzip it and move `MenuTint.app` to your Applications folder.
            The app isn't notarized, so the first time right-click it and choose **Open**
            (or run `xattr -dr com.apple.quarantine /Applications/MenuTint.app`).
            Then grant the Screen Recording permission and open the app again.

            Requires macOS 13 or later (Apple Silicon and Intel).
